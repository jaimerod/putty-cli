[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "putty-cli"
version = "1.0.0"
description = "PuTTY .reg export -> fuzzy menu -> native ssh, with .ppk conversion, tmux logging and jump-host support"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jaime" }]
dependencies = [
    "simple-term-menu>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.10",
    "ruff>=0.6",
    "bandit>=1.7",
    "pre-commit>=3.7",
    "pip-tools>=7",
]

[project.scripts]
putty-cli = "putty:main"

[tool.setuptools]
py-modules = ["putty"]
packages = ["utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.9"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "S101",  # asserts are fine (tests)
    "S404",  # subprocess is the point of this tool
    "S603",  # subprocess with list argv, not shell
    "S607",  # partial-path subprocess (ssh/tmux/puttygen resolved from PATH)
    "S108",  # /tmp paths in tests only
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]